<head>

<title>NLarn</title>
<style>
html, body { margin: 0; height: 100%; background: #000; color: #ccc; font-family: sans-serif; }

</style>

<div id="bar"><button id="btn-tiles" title="Map tiles: Amiga Larn set or text">Tiles: Amiga</button></div>
